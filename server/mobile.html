<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <title>AYG B2B Mobil</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --green: #10b981;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 40px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(8px);
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .brand { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .rates { font-size: 11px; color: var(--muted); }
    .search-box {
      display: flex;
      gap: 8px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-box button {
      padding: 0 18px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .margin-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .margin-box input {
      width: 56px;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      text-align: center;
      font-weight: 600;
    }
    .mode-btn {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .mode-btn.active {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--green);
      color: #34d399;
    }
    .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .margin-box.hidden { display: none; }
    body.customer-mode .margin-box { display: none; }
    body.customer-mode #margin-mode-btn { display: none; }
    body.customer-mode .buy-col { display: none; }
    body.customer-mode .badge-diff { display: none; }
    body.customer-mode .badge-best { display: none; }
    body.customer-mode .prices { grid-template-columns: 1fr; }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 14px 4px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .results {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card.cheapest {
      border-color: var(--green);
      box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.3);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .badge-source {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }
    .badge-best {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .badge-diff {
      font-size: 11px;
      font-weight: 600;
      color: #fbbf24;
    }
    .card-main {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .thumb-wrap {
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #fff;
    }
    .thumb-fallback {
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      opacity: 0.65;
    }
    .prod-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
      text-decoration: none;
      flex: 1;
    }
    .load-more-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .load-more-btn:active { background: var(--border); }
    .card.has-photo { cursor: pointer; }
    .img-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .img-modal.open { display: flex; }
    .img-modal-box {
      position: relative;
      max-width: 92vw;
      max-height: 85vh;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .img-modal-box img {
      max-width: 100%;
      max-height: 68vh;
      border-radius: 10px;
      background: #fff;
      object-fit: contain;
    }
    .img-modal-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
      line-height: 1.35;
    }
    .img-modal-close {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .prices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .price-col { display: flex; flex-direction: column; }
    .price-label { font-size: 11px; color: var(--muted); }
    .price-val { font-size: 16px; font-weight: 700; color: var(--text); }
    .price-sub { font-size: 11px; color: var(--muted); }
    .price-sell { color: #34d399; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-row">
      <div class="brand">📦 AYG B2B Mobil</div>
      <div class="rates" id="rates-info">Yükleniyor...</div>
    </div>
    <form class="search-box" id="search-form">
      <input type="search" id="q-input" placeholder="Ürün adı veya kod yazın..." autocomplete="off" />
      <button type="submit" id="search-btn">Ara</button>
    </form>
    <div class="controls">
      <span id="status-text">Hazır</span>
      <div class="controls-right">
        <button type="button" class="mode-btn" id="customer-mode-btn">👁️ Müşteri</button>
        <button type="button" class="mode-btn active" id="margin-mode-btn">Kademeli</button>
        <div class="margin-box hidden" id="margin-box">
          <span>Kâr %</span>
          <input type="number" id="margin-input" value="40" min="0" />
        </div>
      </div>
    </div>
  </header>

  <div class="filters" id="filters"></div>
  <div class="results" id="results">
    <div class="empty">Aramak istediğiniz ürünü yukarıya yazın.<br/>Tüm B2B siteleri taranıp en ucuz alıştan pahalıya sıralanacaktır.</div>
  </div>

  <div class="img-modal" id="img-modal">
    <div class="img-modal-box" onclick="event.stopPropagation()">
      <button type="button" class="img-modal-close" id="img-modal-close">✕</button>
      <img id="img-modal-src" src="" alt="" />
      <div class="img-modal-title" id="img-modal-title"></div>
    </div>
  </div>

  <script>
    let allItems = [];
    let activeFilter = 'ALL';
    const PAGE_SIZE = 30;
    let visibleCount = PAGE_SIZE;
    let customerMode = false;
    let marginMode = 'tiered';
    const TIERED_MARGINS = [
      { min: 0, max: 100, margin: 45 },
      { min: 100, max: 1000, margin: 30 },
      { min: 1000, max: 5000, margin: 20 },
      { min: 5000, max: 20000, margin: 15 },
      { min: 20000, max: Infinity, margin: 10 }
    ];
    function getEffectiveMargin(basePrice) {
      if (marginMode === 'tiered') {
        const p = parseFloat(basePrice) || 0;
        let matched = 40;
        for (const t of TIERED_MARGINS) {
          if (p >= t.min && p <= t.max) matched = t.margin;
        }
        return matched;
      }
      return parseFloat(document.getElementById('margin-input').value) || 0;
    }

    const fmt = (n) => Number(n || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₺';
    const esc = (s) => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    document.getElementById('customer-mode-btn').addEventListener('click', () => {
      customerMode = !customerMode;
      document.body.classList.toggle('customer-mode', customerMode);
      const btn = document.getElementById('customer-mode-btn');
      btn.classList.toggle('active', customerMode);
      btn.textContent = customerMode ? '👁️ Müşteri: Açık' : '👁️ Müşteri';
      renderList();
    });

    const imgModal = document.getElementById('img-modal');
    const imgModalSrc = document.getElementById('img-modal-src');
    const imgModalTitle = document.getElementById('img-modal-title');
    function openImgModal(src, title) {
      imgModalSrc.src = src;
      imgModalTitle.textContent = title || '';
      imgModal.classList.add('open');
    }
    function closeImgModal() {
      imgModal.classList.remove('open');
      imgModalSrc.src = '';
    }
    imgModal.addEventListener('click', closeImgModal);
    document.getElementById('img-modal-close').addEventListener('click', closeImgModal);

    fetch('/api/status').then(r => r.json()).then(d => {
      if (d.ok) {
        document.getElementById('rates-info').textContent =
          `$ ${d.exchangeRates.USD.toFixed(2)} | € ${d.exchangeRates.EUR.toFixed(2)} | Fırat: ${d.firatCount}`;
      }
    }).catch(() => {});

    document.getElementById('margin-mode-btn').addEventListener('click', () => {
      marginMode = marginMode === 'tiered' ? 'flat' : 'tiered';
      const btn = document.getElementById('margin-mode-btn');
      btn.classList.toggle('active', marginMode === 'tiered');
      btn.textContent = marginMode === 'tiered' ? 'Kademeli' : 'Sabit %';
      document.getElementById('margin-box').classList.toggle('hidden', marginMode === 'tiered');
      renderList();
    });

    document.getElementById('margin-input').addEventListener('input', renderList);

    document.getElementById('search-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = document.getElementById('q-input').value.trim();
      if (!q) return;

      const btn = document.getElementById('search-btn');
      const status = document.getElementById('status-text');
      const resultsEl = document.getElementById('results');

      btn.disabled = true;
      btn.textContent = '...';
      status.textContent = 'B2B siteleri taranıyor...';
      resultsEl.innerHTML = '<div class="empty">⏳ Tüm tedarikçilerden fiyatlar çekiliyor...</div>';

      try {
        const res = await fetch('/api/search?q=' + encodeURIComponent(q));
        const data = await res.json();
        allItems = data.items || [];
        activeFilter = 'ALL';
        visibleCount = PAGE_SIZE;
        status.textContent = `${allItems.length} ürün (${(data.elapsedMs / 1000).toFixed(1)} sn)`;
        renderFilters();
        renderList();
      } catch (err) {
        status.textContent = 'Bağlantı hatası';
        resultsEl.innerHTML = `<div class="empty">Hata: ${esc(err.message)}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ara';
      }
    });

    function renderFilters() {
      const el = document.getElementById('filters');
      if (allItems.length === 0) { el.innerHTML = ''; return; }
      const counts = {};
      allItems.forEach(i => { counts[i.sourceKey] = (counts[i.sourceKey] || 0) + 1; });

      let html = `<div class="chip ${activeFilter==='ALL'?'active':''}" data-key="ALL">Tümü (${allItems.length})</div>`;
      const names = {};
      allItems.forEach(i => { names[i.sourceKey] = i.sourceName; });
      Object.keys(counts).forEach(k => {
        html += `<div class="chip ${activeFilter===k?'active':''}" data-key="${k}">${esc(names[k])} (${counts[k]})</div>`;
      });
      el.innerHTML = html;
      el.querySelectorAll('.chip').forEach(c => {
        c.onclick = () => { activeFilter = c.dataset.key; visibleCount = PAGE_SIZE; renderFilters(); renderList(); };
      });
    }

    function renderList() {
      const el = document.getElementById('results');
      const margin = parseFloat(document.getElementById('margin-input').value) || 0;
      const list = activeFilter === 'ALL' ? allItems : allItems.filter(i => i.sourceKey === activeFilter);

      if (list.length === 0) {
        el.innerHTML = '<div class="empty">Sonuç bulunamadı.</div>';
        return;
      }

      const minPrice = list[0].unitNetPrice;
      const shown = list.slice(0, visibleCount);
      let html = shown.map((item, idx) => {
        const isBest = idx === 0;
        const diffPct = minPrice > 0 ? Math.round(((item.unitNetPrice - minPrice) / minPrice) * 100) : 0;
        const itemMargin = getEffectiveMargin(item.netPrice);
        const sellWithVat = item.vatPrice * (1 + itemMargin / 100);
        const nameHtml = `<div class="prod-name">${esc(item.name)}</div>`;
        const thumbHtml = item.imgUrl
          ? `<div class="thumb-wrap"><img src="${esc(item.imgUrl)}" loading="lazy" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><span class="thumb-fallback">📦</span></div>`
          : `<div class="thumb-wrap"><span class="thumb-fallback" style="display:flex">📦</span></div>`;
        const sellLabel = customerMode ? 'Satış Fiyatı (KDV Dahil)' : `Satış (+%${itemMargin} Kâr, KDV Dahil)`;

        return `
          <div class="card ${isBest ? 'cheapest' : ''} ${item.imgUrl ? 'has-photo' : ''}" data-name="${esc(item.name)}">
            <div class="card-top">
              <span class="badge-source">${esc(item.sourceName)}</span>
              ${isBest
                ? `<span class="badge-best">🏆 EN UCUZ ALIŞ</span>`
                : (diffPct > 0 ? `<span class="badge-diff">+%${diffPct} daha pahalı</span>` : '')}
            </div>
            <div class="card-main">
              ${thumbHtml}
              ${nameHtml}
            </div>
            <div class="prices">
              <div class="price-col buy-col">
                <span class="price-label">Alış (KDV Hariç)</span>
                <span class="price-val">${fmt(item.netPrice)}</span>
                <span class="price-sub">KDV Dahil: ${fmt(item.vatPrice)}</span>
              </div>
              <div class="price-col">
                <span class="price-label">${sellLabel}</span>
                <span class="price-val price-sell">${fmt(sellWithVat)}</span>
                <span class="price-sub">${item.packQuantity > 1 ? `${item.packQuantity}li Paket (${fmt(item.unitNetPrice)}/Ad)` : esc(item.unit)}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (list.length > visibleCount) {
        html += `<button type="button" class="load-more-btn" id="load-more-btn">Daha Fazla Göster (${shown.length} / ${list.length})</button>`;
      }

      el.innerHTML = html;

      el.querySelectorAll('.card.has-photo').forEach(card => {
        card.onclick = () => {
          const img = card.querySelector('.thumb-wrap img');
          if (img && img.style.display !== 'none') {
            openImgModal(img.src, card.dataset.name);
          }
        };
      });

      const moreBtn = document.getElementById('load-more-btn');
      if (moreBtn) {
        moreBtn.onclick = () => {
          visibleCount += PAGE_SIZE;
          renderList();
        };
      }
    }
  </script>
</body>
</html>
